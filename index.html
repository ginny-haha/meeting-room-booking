<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司會議室預約系統 - 雲端同步版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 這裡保留你原本 v3 版本的 CSS 樣式 */
        :root {
            --color-background-primary: #ffffff;
            --color-text-primary: #1a1a1a;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;color:var(--color-text-primary);padding:20px}
        .app{max-width:1200px;margin:0 auto}
        .header{background:#fff;padding:1rem;border-radius:12px;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
        th,td{border:1px solid #eee;padding:12px;text-align:center}
        .time-th{background:#f8f9fa;width:100px;font-weight:bold}
        .booking-block{background:#e6f1fb;color:#185fa5;padding:4px;border-radius:4px;font-size:12px;cursor:pointer}
        /* 簡化版樣式，實際建議保留原本完整的 CSS */
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>會議室預約系統 <span style="font-size: 12px; color: green;">● 雲端已連線</span></h1>
        <div id="dateDisplay">載入中...</div>
    </div>
    <div id="tableContainer"></div>
</div>

<script>
    // 1. 請填入你的 Supabase 資訊
    const SUPABASE_URL = 'https://twaxasvswqlyuaxlxtit.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYm1kanhyeGFwaXBqd21yamd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTQ4NzgsImV4cCI6MjA5NDIzMDg3OH0.C7pm4ID71D8X5lil5N9eugaGWitnSp8WsNOc7bkRyqw';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ROOMS = ['第一會議室', '第二會議室', '第三會議室'];
    let currentDate = new Date().toISOString().split('T')[0];

    // 2. 從 Supabase 讀取預約紀錄
    async function fetchBookings() {
        const { data, error } = await supabase
            .from('bookings')
            .select('*')
            .eq('date', currentDate);

        if (error) {
            console.error('讀取失敗:', error);
            return [];
        }
        return data;
    }

    // 3. 提交預約到 Supabase
    async function addBooking(newBooking) {
        const { data, error } = await supabase
            .from('bookings')
            .insert([
                {
                    room_idx: newBooking.roomIdx,
                    date: currentDate,
                    start_slot: newBooking.startSlot,
                    end_slot: newBooking.endSlot,
                    dept: newBooking.dept,
                    user_name: newBooking.userName,
                    purpose: newBooking.purpose,
                    recur_type: 'once'
                }
            ]);

        if (error) {
            alert('預約失敗：' + error.message);
        } else {
            alert('預約成功！');
            renderTable(); // 重新整理畫面
        }
    }

    // 4. 渲染表格邏輯 (串接資料庫數據)
    async function renderTable() {
        const bookings = await fetchBookings();
        document.getElementById('dateDisplay').innerText = `目前日期: ${currentDate}`;
        
        // 這裡會放置原本 V3 的表格生成邏輯，但資料來源改為 bookings 變數
        console.log('當前雲端預約資料:', bookings);
        // ... (省略部分渲染邏輯以保持長度，建議將 V3 的 render 函式貼回此處並修改資料來源)
    }

    renderTable();
</script>

</body>
</html>
