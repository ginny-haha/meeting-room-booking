<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>會議室預約系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #185fa5; color: white; }
        .booking-info { background: #e7f3ff; color: #185fa5; border-radius: 4px; padding: 4px; font-size: 13px; }
        .add-btn { color: #ccc; cursor: pointer; font-size: 20px; }
        #modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:30px; box-shadow:0 0 15px rgba(0,0,0,0.2); border-radius:10px; z-index:100; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>會議室預約 <span id="conn-status" style="font-size:14px; color:orange;">(連線中...)</span></h2>
        <div>
            <button onclick="changeDate(-1)">前一天</button>
            <span id="dateText" style="font-weight:bold; margin:0 10px;"></span>
            <button onclick="changeDate(1)">後一天</button>
        </div>
    </div>
    <div id="grid"></div>
</div>

<div id="modal">
    <h3>新增預約</h3>
    <p>姓名: <input type="text" id="u-name"></p>
    <p>部門: <input type="text" id="u-dept"></p>
    <button onclick="save()">確認</button>
    <button onclick="document.getElementById('modal').style.display='none'">取消</button>
</div>

<script>
    // 這裡請務必填寫正確，不要刪掉單引號 ''
    const URL = 'https://twaxasvswqlyuaxlxtit.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwYm1kanhyeGFwaXBqd21yamd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTQ4NzgsImV4cCI6MjA5NDIzMDg3OH0.C7pm4ID71D8X5lil5N9eugaGWitnSp8WsNOc7bkRyqw';

    let client;
    let today = new Date().toISOString().split('T')[0];
    let activeCell = null;

    const ROOMS = ['第一會議室', '第二會議室', '第三會議室'];
    const TIMES = ["09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00"];

    function init() {
        if (typeof supabase !== 'undefined') {
            client = supabase.createClient(URL, KEY);
            document.getElementById('conn-status').innerText = '● 雲端已連線';
            document.getElementById('conn-status').style.color = 'green';
            load();
        } else {
            setTimeout(init, 300);
        }
    }

    async function load() {
        document.getElementById('dateText').innerText = today;
        const { data, error } = await client.from('booking').select('*').eq('date', today);
        
        let tableHtml = '<table><tr><th>時間</th>' + ROOMS.map(r => `<th>${r}</th>`).join('') + '</tr>';
        
        TIMES.forEach(t => {
            tableHtml += `<tr><td>${t}</td>`;
            ROOMS.forEach((r, idx) => {
                const item = data?.find(d => d.room_idx === idx && d.start_slot === t);
                if (item) {
                    tableHtml += `<td><div class="booking-info">${item.dept}<br>${item.user_name}</div></td>`;
                } else {
                    tableHtml += `<td class="add-btn" onclick="pop(${idx}, '${t}')">+</td>`;
                }
            });
            tableHtml += '</tr>';
        });
        document.getElementById('grid').innerHTML = tableHtml + '</table>';
    }

    function pop(idx, t) {
        activeCell = { idx, t };
        document.getElementById('modal').style.display = 'block';
    }

    async function save() {
        const name = document.getElementById('u-name').value;
        const dept = document.getElementById('u-dept').value;
        if(!name || !dept) return alert('請填寫完整');

        const { error } = await client.from('booking').insert([{
            room_idx: activeCell.idx,
            date: today,
            start_slot: activeCell.t,
            user_name: name,
            dept: dept
        }]);

        if (error) alert('失敗: ' + error.message);
        else {
            document.getElementById('modal').style.display = 'none';
            load();
        }
    }

    function changeDate(n) {
        let d = new Date(today);
        d.setDate(d.getDate() + n);
        today = d.toISOString().split('T')[0];
        load();
    }

    init();
</script>
</body>
</html>
