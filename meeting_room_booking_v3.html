
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,'Segoe UI',sans-serif);background:var(--color-background-tertiary);color:var(--color-text-primary)}
.app{padding:1rem}
.header{background:var(--color-background-primary);border:1px solid #c8c8c8;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.header-title{display:flex;align-items:center;gap:10px}
.header-title h1{font-size:18px;font-weight:500}
.badge{background:#e6f1fb;color:#185fa5;font-size:11px;padding:3px 8px;border-radius:8px}
.date-nav{display:flex;align-items:center;gap:.5rem}
.date-nav button{background:var(--color-background-primary);border:1px solid #bbb;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--color-text-primary);font-size:14px}
.date-nav button:hover{background:var(--color-background-secondary)}
.date-nav .date-label{font-size:15px;font-weight:500;min-width:130px;text-align:center}
.date-nav input[type=date]{font-family:inherit;font-size:14px;border:1px solid #bbb;border-radius:8px;padding:5px 8px;background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer}
.today-btn{background:#e6f1fb!important;color:#185fa5!important;border-color:#b5d4f4!important;font-size:12px!important}
.legend{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.25rem 0 .75rem}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary)}
.legend-dot{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.1)}
.board-scroll{overflow-x:auto;background:var(--color-background-primary);border:1px solid #c8c8c8;border-radius:12px}
.board-table{border-collapse:collapse;min-width:700px;width:100%}
.board-table th,.board-table td{border:1px solid #d0d0d0}
.corner-th{background:#f5f5f3;padding:8px 10px;font-size:12px;color:var(--color-text-secondary);font-weight:400;min-width:64px;position:sticky;left:0;z-index:5}
.room-th{padding:8px 6px;font-size:12px;font-weight:500;text-align:center;min-width:110px;background:var(--color-background-secondary)}
.time-th{background:#f5f5f3;padding:6px 8px;font-size:12px;font-weight:400;color:var(--color-text-secondary);white-space:nowrap;position:sticky;left:0;z-index:4;min-width:64px}
.time-th.hour-mark{color:var(--color-text-primary);font-weight:500;background:#eeede8}
.data-cell{padding:0;height:36px;cursor:pointer;transition:background .1s;position:relative;vertical-align:middle}
.data-cell:hover{background:#f0f8f4}
.data-cell.hour-row{border-top:1.5px solid #b0b0b0!important}
.booking-block{position:absolute;inset:2px;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:11px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:2}
.tag-recur{display:inline-block;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:4px;background:rgba(255,255,255,.5);color:inherit}
.modal-portal{position:absolute;top:0;left:0;right:0;z-index:999;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;background:rgba(0,0,0,.5);min-height:100%}
.modal{background:#ffffff;color:#1a1a1a;border-radius:12px;border:1px solid #c8c8c8;padding:1.5rem;width:100%;max-width:460px;position:relative;z-index:1000;margin:0 auto}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:8px;color:#1a1a1a}
.form-group{margin-bottom:.875rem}
.form-group label{display:block;font-size:13px;color:#555;margin-bottom:4px}
.form-group input,.form-group select{width:100%;font-family:inherit;font-size:14px;border:1px solid #bbb;border-radius:8px;padding:8px 10px;background:#fff;color:#1a1a1a}
.form-group input:focus,.form-group select:focus{outline:none;box-shadow:0 0 0 2px rgba(55,138,221,.3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.recur-section{background:#f5f5f3;border-radius:8px;padding:.75rem;margin-bottom:.875rem;border:1px solid #e0e0e0}
.recur-section h3{font-size:13px;font-weight:500;margin-bottom:.625rem;color:#555}
.radio-group{display:flex;gap:.75rem;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;color:#333}
.btn-row{display:flex;gap:.625rem;justify-content:flex-end;margin-top:1rem}
.btn{font-family:inherit;font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid #bbb;background:#fff;color:#333;transition:background .15s}
.btn:hover{background:#f0f0ee}
.btn.primary{background:#1d9e75;color:#fff;border-color:transparent}
.btn.primary:hover{background:#0f6e56}
.btn.danger{background:#e24b4a;color:#fff;border-color:transparent}
.btn.danger:hover{background:#a32d2d}
.detail-row{display:flex;gap:.5rem;margin-bottom:.625rem;font-size:14px}
.detail-row .lbl{color:#666;min-width:72px;font-size:13px;flex-shrink:0}
.detail-row .val{color:#1a1a1a}
.toast-wrap{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);z-index:1001;width:90%;max-width:420px;pointer-events:none}
.toast{background:#fff;border:1px solid #bbb;border-radius:12px;padding:.75rem 1.25rem;font-size:14px;text-align:center;color:#333}
.toast.error{border-color:#e24b4a;color:#a32d2d;background:#fff8f8}
.toast.success{border-color:#1d9e75;color:#0f6e56;background:#f0faf6}
.toast.warn{border-color:#ba7517;color:#854f0b;background:#fdf6ec}
.cancel-section{border-top:1px solid #e0e0e0;padding-top:1rem;margin-top:.5rem}
.cancel-section h3{font-size:14px;font-weight:500;margin-bottom:.75rem;color:#a32d2d}
.pin-row{display:flex;gap:.5rem;margin-bottom:.75rem}
.pin-row input{width:46px;height:46px;text-align:center;font-size:20px;font-weight:500;border:1px solid #bbb;border-radius:8px;background:#fff;color:#1a1a1a}
.pin-row input:focus{outline:none;box-shadow:0 0 0 2px rgba(226,75,74,.3)}
.cancel-opts{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.75rem}
.cancel-opt-btn{background:#f5f5f3;border:1px solid #ddd;border-radius:8px;padding:.625rem .875rem;cursor:pointer;font-size:13px;text-align:left;color:#333}
.cancel-opt-btn:hover{background:#e8e8e4}
.room-info-pill{background:#f0f8f4;border:1px solid #c8e8d8;border-radius:8px;padding:.5rem .75rem;font-size:13px;color:#0f6e56;margin-bottom:1rem}
.hint{font-size:12px;color:#888;margin-top:3px}
</style>

<div style="position:relative" id="page-root">
  <div class="app" id="root"></div>
  <div id="modal-layer" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:999"></div>
  <div id="toast-layer" style="position:absolute;top:.75rem;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:1001"></div>
</div>

<script>
const ROOMS=['台北大會議室','台北小會議室','彰化大會議室','彰化小會議室','越南AP會議室'];
const SLOTS=[];
for(let h=6;h<20;h++){SLOTS.push(`${String(h).padStart(2,'0')}:00`);SLOTS.push(`${String(h).padStart(2,'0')}:30`);}
const ROOM_BG=['#e1f5ee','#e6f1fb','#faeeda','#fbeaf0','#eeedfe'];
const ROOM_TXT=['#0f6e56','#185fa5','#854f0b','#993556','#534ab7'];
const ROOM_BORDER=['#5dcaa5','#85b7eb','#ef9f27','#ed93b1','#afa9ec'];
const ROOM_HDR=['#d0f0e4','#d4e8f8','#f5ddb0','#f5d0df','#dddcf8'];
const STORAGE_KEY='mbs_v4_bookings';

function loadB(){try{const d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):{}}catch(e){return{}}}
function saveB(b){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(b))}catch(e){}}

let bookings=loadB();
let currentDate=todayStr();
let modal=null;
let toastData=null;
let toastTimer=null;

function todayStr(){
  const d=new Date();
  return d.toLocaleString('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-');
}
function dateLabel(ds){
  const[y,m,d]=ds.split('-');
  const days=['日','一','二','三','四','五','六'];
  const dt=new Date(Number(y),Number(m)-1,Number(d));
  return `${y}/${m}/${d} (${days[dt.getDay()]})`;
}
function addDays(ds,n){
  const[y,m,d]=ds.split('-').map(Number);
  const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);
  return dt.toLocaleDateString('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-');
}
function genId(){return'b'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function slotIdx(time){return SLOTS.indexOf(time)}
function getBookingsForDate(date){
  return Object.values(bookings).filter(b=>b.dates&&b.dates.includes(date)&&!b.cancelledDates?.includes(date));
}
function getOccupied(date,ri){
  const s=new Set();
  getBookingsForDate(date).filter(b=>b.roomIdx===ri).forEach(b=>{
    const si=slotIdx(b.startSlot);
    for(let i=0;i<b.duration;i++)s.add(si+i);
  });
  return s;
}
function getBookingAt(date,ri,si){
  return getBookingsForDate(date).find(b=>{
    if(b.roomIdx!==ri)return false;
    const s=slotIdx(b.startSlot);
    return si>=s&&si<s+b.duration;
  })||null;
}

function showToast(msg,type='info',dur=3500){
  if(toastTimer)clearTimeout(toastTimer);
  toastData={msg,type};renderToast();
  toastTimer=setTimeout(()=>{toastData=null;renderToast();},dur);
}

function renderToast(){
  const layer=document.getElementById('toast-layer');
  layer.innerHTML='';
  if(!toastData)return;
  const t=document.createElement('div');
  t.className='toast '+toastData.type;
  t.style.cssText='background:#fff;border:1px solid #bbb;border-radius:12px;padding:.75rem 1.25rem;font-size:14px;text-align:center;max-width:420px;width:90%';
  if(toastData.type==='error'){t.style.borderColor='#e24b4a';t.style.color='#a32d2d';t.style.background='#fff8f8';}
  else if(toastData.type==='success'){t.style.borderColor='#1d9e75';t.style.color='#0f6e56';t.style.background='#f0faf6';}
  else if(toastData.type==='warn'){t.style.borderColor='#ba7517';t.style.color='#854f0b';t.style.background='#fdf6ec';}
  t.textContent=toastData.msg;
  layer.appendChild(t);
}

function openBookingModal(ri,si){
  const occ=getOccupied(currentDate,ri);
  let maxAvail=0;
  for(let i=si;i<SLOTS.length;i++){if(occ.has(i))break;maxAvail++;}
  if(maxAvail===0){showToast('此時段已無可用空間','error');return;}
  const opts=[];
  for(let d=1;d<=maxAvail;d++){
    const ei=si+d;
    const endTime=ei<SLOTS.length?SLOTS[ei]:'20:00';
    opts.push({value:d,label:`${SLOTS[si]} - ${endTime}（${d*30}分鐘）`});
  }
  modal={type:'book',roomIdx:ri,slotIdx:si,durationOptions:opts,form:{name:'',dept:'',duration:1,purpose:'',pin:'',recurType:'once',recurEnd:''}};
  renderModal();
}
function openDetailModal(booking,date){
  modal={type:'detail',booking,date,cancelStep:0,cancelPin:''};
  renderModal();
}
function closeModal(){
  modal=null;
  const layer=document.getElementById('modal-layer');
  layer.innerHTML='';
  layer.style.display='none';
  document.getElementById('page-root').style.minHeight='';
}

function submitBooking(){
  const{roomIdx,slotIdx:si,form}=modal;
  const{name,dept,duration,purpose,pin,recurType,recurEnd}=form;
  if(!name.trim()||!dept.trim()||!purpose.trim()||pin.length!==4){
    showToast('請填寫所有必填欄位，取消密碼需為4位數字','error');return;
  }
  const startSlot=SLOTS[si];
  let dates=[];
  if(recurType==='once'){dates=[currentDate];}
  else{
    if(!recurEnd){showToast('請選擇循環結束日期','error');return;}
    let d=currentDate;const step=recurType==='weekly'?7:14;
    while(d<=recurEnd){dates.push(d);d=addDays(d,step);}
  }
  const conflicts=[];
  dates.forEach(date=>{
    const occ=getOccupied(date,roomIdx);
    for(let i=si;i<si+Number(duration);i++){if(occ.has(i)){conflicts.push(date);break;}}
  });
  const okDates=dates.filter(d=>!conflicts.includes(d));
  if(okDates.length===0){showToast('所選時段已全部被預約，請選擇其他時段','error');closeModal();renderBoard();return;}
  const id=genId();
  bookings[id]={id,roomIdx,startSlot,duration:Number(duration),name:name.trim(),dept:dept.trim(),purpose:purpose.trim(),pin,dates:okDates,recurType,recurEnd:recurEnd||null,cancelledDates:[],createdAt:Date.now()};
  saveB(bookings);closeModal();renderBoard();
  if(conflicts.length>0)showToast('部分日期衝突已略過：'+conflicts.join(', '),'warn',6000);
  else showToast('預約成功！','success');
}

function cancelBooking(booking,date,mode){
  if(mode==='single'){
    if(!bookings[booking.id])return;
    if(!bookings[booking.id].cancelledDates)bookings[booking.id].cancelledDates=[];
    bookings[booking.id].cancelledDates.push(date);
    const b=bookings[booking.id];
    if(b.dates.every(d=>b.cancelledDates.includes(d)))delete bookings[booking.id];
  }else{
    const bd={...bookings[booking.id]};
    delete bookings[booking.id];
    const kept=bd.dates.filter(d=>d<date);
    if(kept.length>0){const nid=genId();bookings[nid]={...bd,id:nid,dates:kept,cancelledDates:[]};}
  }
  saveB(bookings);closeModal();renderBoard();showToast('預約已取消','success');
}

function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  if(children)children.forEach(c=>{
    if(c==null)return;
    if(typeof c==='string')e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function txt(s){return document.createTextNode(s)}

function renderModal(){
  const layer=document.getElementById('modal-layer');
  layer.innerHTML='';
  if(!modal){layer.style.display='none';return;}

  const pageRoot=document.getElementById('page-root');
  const pageH=pageRoot.scrollHeight;
  layer.style.display='block';
  layer.style.minHeight=pageH+'px';
  layer.style.background='rgba(0,0,0,0.5)';
  layer.style.display='flex';
  layer.style.alignItems='flex-start';
  layer.style.justifyContent='center';
  layer.style.padding='2rem 1rem';

  layer.onclick=e=>{if(e.target===layer)closeModal();};

  const m=modal.type==='book'?renderBookModal():renderDetailModal();
  layer.appendChild(m);

  window.scrollTo({top:0,behavior:'smooth'});
}

function renderBookModal(){
  const m=el('div',{class:'modal'});
  const hdr=el('h2');
  hdr.innerHTML='<i class="ti ti-calendar-plus" style="color:#185fa5" aria-hidden="true"></i>';
  hdr.appendChild(txt(' 新增預約'));
  m.appendChild(hdr);
  m.appendChild(el('div',{class:'room-info-pill'},[ROOMS[modal.roomIdx]+' | '+dateLabel(currentDate)]));

  const r1=el('div',{class:'form-row'});
  const fg1=el('div',{class:'form-group'});
  fg1.appendChild(el('label',{},['申請人姓名 *']));
  fg1.appendChild(el('input',{type:'text',placeholder:'請輸入姓名',value:modal.form.name,onInput:e=>modal.form.name=e.target.value}));
  const fg2=el('div',{class:'form-group'});
  fg2.appendChild(el('label',{},['申請人部門 *']));
  fg2.appendChild(el('input',{type:'text',placeholder:'如：人資部',value:modal.form.dept,onInput:e=>modal.form.dept=e.target.value}));
  r1.appendChild(fg1);r1.appendChild(fg2);m.appendChild(r1);

  const fg3=el('div',{class:'form-group'});
  fg3.appendChild(el('label',{},['預約時段 *']));
  const sel=el('select',{onChange:e=>modal.form.duration=Number(e.target.value)});
  modal.durationOptions.forEach(o=>{
    const opt=el('option',{value:o.value},[o.label]);
    if(Number(o.value)===modal.form.duration)opt.setAttribute('selected','selected');
    sel.appendChild(opt);
  });
  fg3.appendChild(sel);m.appendChild(fg3);

  const fg4=el('div',{class:'form-group'});
  fg4.appendChild(el('label',{},['預約目的 *']));
  fg4.appendChild(el('input',{type:'text',placeholder:'如：部門週會、面試、客戶拜訪',value:modal.form.purpose,onInput:e=>modal.form.purpose=e.target.value}));
  m.appendChild(fg4);

  const fg5=el('div',{class:'form-group'});
  fg5.appendChild(el('label',{},['取消密碼（4位數字）*']));
  const pi=el('input',{type:'password',maxlength:'4',placeholder:'自訂4位數字',value:modal.form.pin,onInput:e=>modal.form.pin=e.target.value.replace(/\D/g,'').slice(0,4)});
  fg5.appendChild(pi);
  fg5.appendChild(el('div',{class:'hint'},['此密碼用於日後取消預約，請務必記住']));
  m.appendChild(fg5);

  const rs=el('div',{class:'recur-section'});
  const rh=el('h3');rh.innerHTML='<i class="ti ti-repeat" style="font-size:14px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>循環設定';
  rs.appendChild(rh);
  const rg=el('div',{class:'radio-group'});
  [['once','單次（預設）'],['weekly','每週循環'],['biweekly','每兩週循環']].forEach(([val,lbl])=>{
    const lb=el('label');
    const inp=el('input',{type:'radio',name:'recur_m',value:val,onChange:e=>{modal.form.recurType=e.target.value;renderModal();}});
    if(modal.form.recurType===val)inp.setAttribute('checked','checked');
    lb.appendChild(inp);lb.appendChild(txt(' '+lbl));rg.appendChild(lb);
  });
  rs.appendChild(rg);
  if(modal.form.recurType!=='once'){
    const ef=el('div',{class:'form-group',style:{marginTop:'10px',marginBottom:'0'}});
    ef.appendChild(el('label',{},['循環結束日期 *']));
    ef.appendChild(el('input',{type:'date',value:modal.form.recurEnd,min:addDays(currentDate,1),onChange:e=>modal.form.recurEnd=e.target.value}));
    rs.appendChild(ef);
  }
  m.appendChild(rs);

  const br=el('div',{class:'btn-row'});
  br.appendChild(el('button',{class:'btn',onClick:closeModal},['取消']));
  const sb=el('button',{class:'btn primary',onClick:submitBooking});
  sb.innerHTML='<i class="ti ti-check" style="font-size:14px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>完成預約';
  br.appendChild(sb);m.appendChild(br);
  return m;
}

function renderDetailModal(){
  const{booking,date,cancelStep,cancelPin}=modal;
  const ri=booking.roomIdx;
  const si=slotIdx(booking.startSlot);
  const ei=si+booking.duration;
  const endTime=ei<SLOTS.length?SLOTS[ei]:'20:00';

  const m=el('div',{class:'modal'});
  const hdr=el('h2');
  hdr.innerHTML=`<i class="ti ti-calendar-event" style="color:${ROOM_TXT[ri]}" aria-hidden="true"></i>`;
  hdr.appendChild(txt(' 預約詳情'));
  if(booking.recurType!=='once')hdr.appendChild(el('span',{style:{fontSize:'11px',background:ROOM_BG[ri],color:ROOM_TXT[ri],padding:'2px 7px',borderRadius:'8px',marginLeft:'6px'}},['循環預約']));
  m.appendChild(hdr);

  const rows=[['📍 會議室',ROOMS[ri]],['📅 日期',dateLabel(date)],['🕐 時間',`${booking.startSlot} - ${endTime}`],['👤 申請人',booking.name],['🏢 部門',booking.dept],['📌 目的',booking.purpose]];
  if(booking.recurType!=='once'){rows.push(['🔁 循環',booking.recurType==='weekly'?'每週':'每兩週']);rows.push(['⏹ 結束日',booking.recurEnd||'未設定']);}
  rows.forEach(([l,v])=>{
    const r=el('div',{class:'detail-row'});
    r.appendChild(el('span',{class:'lbl'},[l]));
    r.appendChild(el('span',{class:'val'},[v]));
    m.appendChild(r);
  });

  const cs=el('div',{class:'cancel-section'});
  if(cancelStep===0){
    const cb=el('button',{class:'btn danger',onClick:()=>{modal.cancelStep=1;renderModal();}});
    cb.innerHTML='<i class="ti ti-trash" style="font-size:14px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>取消此預約';
    cs.appendChild(cb);
  }else if(cancelStep===1){
    cs.appendChild(el('h3',{},['請輸入取消密碼']));
    const pr=el('div',{class:'pin-row'});
    const pins=[];
    for(let i=0;i<4;i++){
      const inp=el('input',{type:'password',maxlength:'1',value:modal.cancelPin[i]||'',onInput:e=>{
        let p=modal.cancelPin.split('');p[i]=e.target.value.replace(/\D/g,'');
        modal.cancelPin=p.join('').slice(0,4);
        if(e.target.value&&i<3)pins[i+1]?.focus();
        renderModal();
      }});
      pins.push(inp);pr.appendChild(inp);
    }
    cs.appendChild(pr);
    cs.appendChild(el('button',{class:'btn primary',onClick:()=>{
      if(modal.cancelPin!==booking.pin){showToast('密碼錯誤，無法取消','error');return;}
      if(booking.recurType!=='once'&&booking.dates.filter(d=>!booking.cancelledDates?.includes(d)).length>1){modal.cancelStep=2;renderModal();}
      else cancelBooking(booking,date,'single');
    }},['驗證密碼']));
  }else if(cancelStep===2){
    cs.appendChild(el('h3',{},['請選擇取消範圍']));
    const co=el('div',{class:'cancel-opts'});
    co.appendChild(el('button',{class:'cancel-opt-btn',onClick:()=>cancelBooking(booking,date,'single')},['僅取消本日（'+date+'）的預約']));
    co.appendChild(el('button',{class:'cancel-opt-btn',onClick:()=>cancelBooking(booking,date,'future')},['取消本日及之後所有循環預約']));
    cs.appendChild(co);
  }
  m.appendChild(cs);

  m.appendChild(el('div',{class:'btn-row'},[el('button',{class:'btn',onClick:closeModal},['關閉'])]));
  return m;
}

function renderBoard(){
  const root=document.getElementById('root');
  root.innerHTML='';
  root.appendChild(renderHeader());
  root.appendChild(renderLegend());
  root.appendChild(renderBoardTable());
}

function renderHeader(){
  const h=el('div',{class:'header'});
  const left=el('div',{class:'header-title'});
  left.innerHTML='<i class="ti ti-building" style="font-size:20px;color:var(--color-text-secondary)" aria-hidden="true"></i>';
  left.appendChild(el('h1',{},['會議室預約系統']));
  left.appendChild(el('span',{class:'badge'},['GMT+8 台灣時間']));
  h.appendChild(left);
  const nav=el('div',{class:'date-nav'});
  const prev=el('button',{onClick:()=>{currentDate=addDays(currentDate,-1);renderBoard();}});
  prev.innerHTML='<i class="ti ti-chevron-left" aria-hidden="true"></i>';
  const next=el('button',{onClick:()=>{currentDate=addDays(currentDate,1);renderBoard();}});
  next.innerHTML='<i class="ti ti-chevron-right" aria-hidden="true"></i>';
  const lbl=el('span',{class:'date-label'},[dateLabel(currentDate)]);
  const di=el('input',{type:'date',value:currentDate,onChange:e=>{currentDate=e.target.value;renderBoard();}});
  const tb=el('button',{class:'btn today-btn',onClick:()=>{currentDate=todayStr();renderBoard();}},['今天']);
  nav.appendChild(prev);nav.appendChild(lbl);nav.appendChild(next);nav.appendChild(di);nav.appendChild(tb);
  h.appendChild(nav);
  return h;
}

function renderLegend(){
  const w=el('div',{class:'legend'});
  ROOMS.forEach((r,i)=>{
    const it=el('div',{class:'legend-item'});
    it.appendChild(el('div',{class:'legend-dot',style:{background:ROOM_BG[i],borderColor:ROOM_BORDER[i]}}));
    it.appendChild(txt(r));
    w.appendChild(it);
  });
  const fi=el('div',{class:'legend-item'});
  fi.appendChild(el('div',{class:'legend-dot',style:{background:'#f5f5f3',borderColor:'#c8c8c8'}}));
  fi.appendChild(txt('閒置（可點擊預約）'));
  w.appendChild(fi);
  return w;
}

function renderBoardTable(){
  const scroll=el('div',{class:'board-scroll'});
  const table=el('table',{class:'board-table'});
  const thead=el('thead');
  const headerRow=el('tr');
  headerRow.appendChild(el('th',{class:'corner-th'},['時間']));
  ROOMS.forEach((r,i)=>{
    headerRow.appendChild(el('th',{class:'room-th',style:{background:ROOM_HDR[i],color:ROOM_TXT[i]}},[r]));
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody=el('tbody');
  SLOTS.forEach((slot,si)=>{
    const isHour=slot.endsWith(':00');
    const tr=el('tr');
    tr.appendChild(el('th',{class:'time-th'+(isHour?' hour-mark':'')},[slot]));
    ROOMS.forEach((r,ri)=>{
      const booking=getBookingAt(currentDate,ri,si);
      if(booking){
        const bs=slotIdx(booking.startSlot);
        if(bs===si){
          const td=el('td',{class:'data-cell'+(isHour?' hour-row':''),rowspan:booking.duration,style:{position:'relative',verticalAlign:'top',padding:'0'},onClick:()=>openDetailModal(booking,currentDate)});
          const blk=el('div',{class:'booking-block',style:{background:ROOM_BG[ri],color:ROOM_TXT[ri],border:'1px solid '+ROOM_BORDER[ri]}});
          blk.appendChild(txt(`${booking.dept}-${booking.purpose}`));
          if(booking.recurType!=='once')blk.appendChild(el('span',{class:'tag-recur'},['循環']));
          td.appendChild(blk);
          tr.appendChild(td);
        }
      }else{
        tr.appendChild(el('td',{class:'data-cell'+(isHour?' hour-row':''),onClick:()=>openBookingModal(ri,si)}));
      }
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  return scroll;
}

renderBoard();
</script>
